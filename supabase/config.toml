# Only the parts of the Supabase CLI config this project relies on.
project_id = "split-tab"

[functions.notify]
# The function checks the caller's login itself, which works with both old and new Supabase key types.
verify_jwt = false

[functions.month-end]
# Called by the database's own cron job with a shared secret instead of a user login.
verify_jwt = false
